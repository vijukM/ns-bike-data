# SAJT — istorija 2021-01 … 2026-08 za prikaz (docs/data/istorija/). Pokreće se ručno, kad se promeni
# Release istorija-v1 ili sajt/pripremi_istoriju.py. Parquet fajlovi se ne čuvaju u git-u, samo izvedeni JSON.
name: sajt_istorija

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sajt_istorija
  cancel-in-progress: false

jobs:
  istorija:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Biblioteke
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Keš istorije
        id: kes
        uses: actions/cache@v4
        with:
          path: istorija
          key: istorija-v1

      - name: Istorija iz GitHub Release-a (samo ako nije u kešu)
        if: steps.kes.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download istorija-v1 -D istorija

      - name: Priprema JSON-a za sajt
        run: python -m sajt.pripremi_istoriju

      - name: Testovi pripreme
        run: python -m pytest -q tests/test_sajt_istorija.py

      - name: Commit i push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/istorija
          if git diff --cached --quiet; then echo "nema promena"; exit 0; fi
          git commit -m "sajt: istorija (docs/data/istorija)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break; sleep 5; done
