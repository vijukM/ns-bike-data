# Čitanje podataka o biciklistima jednom na sat.
# Glavni okidač: workflow_dispatch koji u XX:01 (Europe/Belgrade) poziva cron-job.org (vidi README).
# Rezerva: schedule u XX:20 — čita samo ako za tekući sat još nema čitanja.
name: citaj

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: citaj
  cancel-in-progress: false

jobs:
  citaj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAMO_AKO_NEMA: ${{ github.event_name == 'schedule' && '--samo-ako-nema' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Čitanje (brza varijanta, bez pregledača)
        id: brza
        continue-on-error: true
        run: python -m scraper.citaj --metod brza --ponavljanja 0 $SAMO_AKO_NEMA

      - name: Čitanje (rezerva, Playwright) — samo ako brza varijanta ne uspe
        id: pregledac
        if: steps.brza.outcome == 'failure'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m scraper.citaj --metod pregledac $SAMO_AKO_NEMA

      - name: Satne vrednosti (prvo čitanje posle ponoći)
        if: steps.brza.outputs.prvo_u_danu == 'true' || steps.pregledac.outputs.prvo_u_danu == 'true'
        run: python -m scraper.satno

      - name: Commit i push podataka
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podaci
          if git diff --cached --quiet; then echo "nema promena"; exit 0; fi
          git commit -q -m "podaci: čitanje $(TZ=Europe/Belgrade date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
