# Čitanje podataka o biciklistima jednom na sat.
# Glavni okidač: workflow_dispatch koji u XX:02 (Europe/Belgrade) poziva cron-job.org (vidi README).
# Rezerva: schedule u XX:20 — čita samo ako za tekući sat još nema čitanja.
name: citaj

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write
  actions: write   # pokretanje prognoza_biciklista.yml

concurrency:
  group: citaj
  cancel-in-progress: false

jobs:
  citaj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAMO_AKO_NEMA: ${{ github.event_name == 'schedule' && '--samo-ako-nema' || '' }}
    steps:
      - name: Početak pokretanja (za pokušaje u +3 i +6 min)
        run: echo "NS_BIKE_POCETAK=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Čitanje (javni fajl, pa sesija — bez pregledača)
        id: brza
        continue-on-error: true
        run: python -m scraper.citaj --metod brza --pokusaji-u 0 $SAMO_AKO_NEMA

      - name: Ponovni pokušaji posle 3 i 6 min (brza, pa Playwright) — samo ako prvi pokušaj ne uspe
        id: pregledac
        if: steps.brza.outcome == 'failure'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m scraper.citaj --metod auto --pokusaji-u 180,360 $SAMO_AKO_NEMA

      - name: Satne vrednosti i Excel za juče (prvo čitanje dana i čitanje u 01:xx)
        if: steps.brza.outputs.obracunaj == 'true' || steps.pregledac.outputs.obracunaj == 'true'
        run: python -m scraper.satno

      - name: Sajt — „Dan na mapi“ za nove dane (docs/data/istorija/sati, posle satnog obračuna)
        if: steps.brza.outputs.obracunaj == 'true' || steps.pregledac.outputs.obracunaj == 'true'
        continue-on-error: true
        run: |
          python -m sajt.sati_novi
          python -m sajt.danas --juce          # konačni snimak jučerašnjeg dana za „Danas uživo“ (izbor dana)

      # rezerva koja nije čitala (za sat već postoji čitanje) ne menja ništa: bez obnove sajta i bez commit-a
      - name: Sajt — „danas do Xh“ po stanici (docs/data/uzivo.json)
        if: always() && steps.brza.outputs.preskoceno != 'true'
        continue-on-error: true
        run: python -m sajt.uzivo

      - name: Sajt — „Danas uživo“ (docs/data/danas.json)
        if: always() && steps.brza.outputs.preskoceno != 'true'

      - name: Sajt — dnevnik čitanja (docs/data/citanja.json, strana „Preuzimanje podataka“)
        if: always() && steps.brza.outputs.preskoceno != 'true'
        continue-on-error: true
        run: python -m sajt.citanja
        continue-on-error: true
        run: python -m sajt.danas

      - name: Commit i push podataka
        if: always() && steps.brza.outputs.preskoceno != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podaci
          [ -e docs/data/uzivo.json ] && git add docs/data/uzivo.json
          [ -e docs/data/danas.json ] && git add docs/data/danas.json
          [ -e docs/data/citanja.json ] && git add docs/data/citanja.json
          git add docs/data/istorija/sati docs/data/istorija/sati_dostupno.json docs/data/dani 2>/dev/null || true
          if git diff --cached --quiet; then echo "nema promena"; exit 0; fi
          git commit -q -m "podaci: čitanje $(TZ=Europe/Belgrade date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Pokreni prognozu biciklista (zvanična u 01:xx, osvežavanje u 07, 13 i 19 h)
        if: steps.brza.outputs.procitano == 'true' || steps.pregledac.outputs.procitano == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SAT: ${{ steps.brza.outputs.lokalni_sat || steps.pregledac.outputs.lokalni_sat }}
          OBRACUNAJ: ${{ steps.brza.outputs.obracunaj == 'true' || steps.pregledac.outputs.obracunaj == 'true' }}
        run: |
          if [ "$OBRACUNAJ" = "true" ] && [ "$SAT" = "01" ]; then
            gh workflow run prognoza_biciklista.yml -f vrsta=zvanicna
          elif [ "$SAT" = "07" ] || [ "$SAT" = "13" ] || [ "$SAT" = "19" ]; then
            gh workflow run prognoza_biciklista.yml -f vrsta=osvezavanje
          else
            echo "sat $SAT: prognoza se ne pokreće"
          fi
