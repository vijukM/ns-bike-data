# PROGNOZA BICIKLISTA (model-v2 = E31) — pokreće je citaj.yml (gh workflow run), nema sopstvenog rasporeda.
#   vrsta=zvanicna     posle satnog obračuna u 01:xx: za danas, podaci do 24:00 juče (preskače se ako već postoji)
#   vrsta=osvezavanje  u 07, 13 i 19 h: za danas i sutra, sa novijom vremenskom prognozom (samo za prikaz)
# Usput preuzima i trajno čuva VREMENSKU PROGNOZU (podaci/vremenska_prognoza/).
name: prognoza_biciklista

on:
  workflow_dispatch:
    inputs:
      vrsta:
        description: "zvanicna | osvezavanje"
        required: true
        type: choice
        options: [zvanicna, osvezavanje]

permissions:
  contents: write

concurrency:
  group: prognoza
  cancel-in-progress: false

jobs:
  prognoza:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-model.txt

      - name: Biblioteke modela (CPU)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-model.txt

      - name: Keš paketa modela
        id: kes
        uses: actions/cache@v4
        with:
          path: model
          key: model-v2

      - name: Paket modela iz GitHub Release-a (samo ako nije u kešu)
        if: steps.kes.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model-v2 -p model.zip
          unzip -q -o model.zip && rm model.zip
          ls -la model

      - name: Prognoza biciklista
        id: prognoza
        run: python -m prognoza_biciklista.izdaj --vrsta ${{ inputs.vrsta }}

      - name: Vremenska prognoza vs. stvarno (svi izvori, poslednjih 10 dana)
        if: always() && steps.prognoza.outcome != 'skipped'
        run: python -m vremenska_prognoza.poredjenje

      - name: Prognoza biciklista vs. stvarno (poslednjih 10 dana, ocena)
        if: always() && steps.prognoza.outcome != 'skipped'
        run: python -m prognoza_biciklista.poredjenje

      - name: Commit i push (prognoza biciklista, vremenska prognoza, sajt)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podaci/prognoza_biciklista podaci/vremenska_prognoza docs/data 2>/dev/null || true
          if git diff --cached --quiet; then echo "nema promena"; exit 0; fi
          git commit -q -m "prognoza biciklista (${{ inputs.vrsta }}): $(TZ=Europe/Belgrade date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
