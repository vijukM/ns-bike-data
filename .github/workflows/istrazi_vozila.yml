# PRIVREMENO (samo grana claude/*): analiza fajlova drumskog saobraćaja — briše se pre spajanja u main.
name: istrazi_vozila
on:
  push:
    branches: ["claude/vibrant-brown-5e4txq"]
    paths: [".github/workflows/istrazi_vozila.yml", ".github/analiza_vozila.py"]
permissions:
  contents: read
jobs:
  istrazi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prvo preuzimanje
        run: |
          mkdir -p v
          for f in counters_georss_sr counters_georss_gps_sr bicycles_georss_gps_sr; do
            curl -sS -m 60 -D "v/$f.1.zaglavlja" -o "v/$f.1.xml" "http://stari.ugzins.rs/SAUS/$f.xml"; echo "$f: $?"
            cat "v/$f.1.zaglavlja"
          done
          date -u
      - name: Analiza
        run: python .github/analiza_vozila.py v/counters_georss_sr.1.xml v/counters_georss_gps_sr.1.xml
      - name: Drugo preuzimanje posle 6 min (koliko često se menja)
        run: |
          sleep 360
          for f in counters_georss_sr counters_georss_gps_sr; do
            curl -sS -m 60 -o "v/$f.2.xml" "http://stari.ugzins.rs/SAUS/$f.xml"
            cmp -s "v/$f.1.xml" "v/$f.2.xml" && echo "$f: ISTO" || echo "$f: PROMENJENO"
            diff <(grep -o '<updated>[^<]*' "v/$f.1.xml" | head -3) <(grep -o '<updated>[^<]*' "v/$f.2.xml" | head -3) || true
          done
          date -u
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vozila
          path: v/
