# Ručno istraživanje mehanizma preuzimanja sa GitHub servera (ispisuje HTML i delove IntraWeb JS-a).
name: istrazi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  istrazi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Dostupnost sajta
        run: curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" http://stari.ugzins.rs/SAUS/QLTCnetTrafficAgent
      - name: Snimanje odgovora
        run: python -m scraper.preuzimanje --istrazi istrazi
      - name: Proba rezervne varijante (Playwright) — ništa se ne čuva
        if: always()
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m scraper.preuzimanje --metod pregledac | head -c 600
      - name: Proba Open-Meteo (faza 3) — ništa se ne čuva
        if: always()
        run: |
          python - <<'PY'
          from prognoza.meteo import preuzmi, obradi
          o = preuzmi()
          df = obradi(o)
          print("sati:", len(df), "|", df["Datum"].min().date(), df["Cas"].iloc[0], "–", df["Datum"].max().date(), df["Cas"].iloc[-1])
          print("jedinice:", o.get("hourly_units"))
          print(df.tail(3).T.to_string())
          PY

      - name: Ispis
        if: always()
        run: |
          for f in istrazi/*.zaglavlja.txt; do
            echo "::group::$f"; cat "$f"; b="${f%.zaglavlja.txt}.telo"
            case "$f" in
              *js_*) grep -oE '.{0,200}(function SubmitClick|SubmitForm|IW_TrackID_|IW_WindowID_|downlink|download).{0,300}' "$b" | head -40 ;;
              *callback*) head -c 3000 "$b" ;;
              *) head -c 12000 "$b" ;;
            esac
            echo; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: istrazi
          path: istrazi/
