<!doctype html>
<html lang="sr-Latn" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa brojača · Biciklisti Novog Sada</title>
  <meta name="description" content="Mapa 46 brojača biciklista u Novom Sadu sa stanjem brojača, biciklističkim stazama i prikazom jednog dana sat po sat.">
  <script>try{var d=document.documentElement,t=localStorage.getItem("ns-tema")||"dark",z=JSON.parse(localStorage.getItem("ns-izgled")||"{}")||{};if(t==="sistem")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.dataset.theme=t;if(!z.raspored&&localStorage.getItem("ns-meni-uzak")==="1")z.raspored="uzak";["boja","gustina","raspored","sirina"].forEach(function(k){if(z[k])d.dataset[k]=z[k]});if(z.smer)d.dir=z.smer}catch(e){}</script>
  <link rel="icon" href="assets/slike/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"
        integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/stil.css?v=202610172200">
</head>
<body data-strana="mapa" data-putanja="Mapa|Mapa brojača">
  <script>if (/rezim=dan/.test(location.search)) { document.body.dataset.strana = "dan"; document.body.dataset.putanja = "Mapa|Dan na mapi"; }</script>
  <main class="sadrzaj" id="sadrzaj">
    <header class="zaglavlje-strane pojava">
      <div>
        <span class="eyebrow">Mapa · 46 brojača · 27 mesta</span>
        <h1>Mapa brojača</h1>
        <p class="uvod" id="uvod">Stanje svakog brojača, biciklističke staze iz OpenStreetMap-a i — u režimu
          <b>dan na mapi</b> — broj biciklista na svakom brojaču sat po sat.</p>
      </div>
    </header>

    <section class="kpi-mreza" id="kpi"></section>

    <section class="kartica pojava">
      <div class="mapa-alat">
        <div class="grupa-kontrola"><span class="eyebrow">Prikaz</span><div id="rezim"></div></div>
        <div class="grupa-kontrola"><span class="eyebrow">Tip mape</span><div id="podloga"></div></div>
        <div class="grupa-kontrola"><span class="eyebrow">Na mapi</span><div id="staze-cip"></div></div>
      </div>
      <div id="legenda-mape" style="margin-bottom:14px"></div>
      <div class="mapa-raspored">
        <div>
          <div class="mapa velika" id="mapa" role="region" aria-label="Mapa brojača"></div>
          <div class="dan-panel skriveno" id="dan-panel">
            <div>
              <div class="kontrole">
                <input type="date" id="dan-datum" min="2021-01-01" max="2026-08-31" aria-label="Dan">
                <button class="dugme malo" type="button" id="dan-pre" aria-label="Prethodni dan">‹</button>
                <button class="dugme malo" type="button" id="dan-posle" aria-label="Sledeći dan">›</button>
                <button class="dugme malo primarno" type="button" id="dan-pusti"></button>
              </div>
              <div class="kontrole" style="margin-top:12px"><span class="eyebrow">Sat</span><input type="range" id="dan-sat" min="0" max="23" value="7" aria-label="Sat"></div>
              <p class="stanje-dana" id="dan-stanje" aria-live="polite"></p>
            </div>
            <div><div class="grafik nizak" id="dan-grafik"></div></div>
          </div>
        </div>
        <aside>
          <div class="alat-tabele" style="margin-bottom:10px">
            <div class="pretraga" style="max-width:none"><svg class="ik" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="search" id="spisak-pretraga" placeholder="Stanica ili ulica…" aria-label="Pretraga stanica"></div>
          </div>
          <div id="spisak-filter" style="margin-bottom:10px"></div>
          <div class="spisak-glava eyebrow"><span>Stanica</span><span id="spisak-kolona"></span></div>
          <div class="spisak" id="spisak" role="list"></div>
          <div class="krofna-okvir">
            <span class="eyebrow">Stanje · <span id="stanje-period"></span></span>
            <div class="grafik krofna" id="krofna" title="Klik na deo grafika filtrira mapu i spisak"></div>
          </div>
        </aside>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"
          integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"

  <script src="assets/zajednicko.js?v=202610172200"></script>

  <script src="assets/pin3d.js?v=202610172200"></script>
  <script src="assets/mapa-modul.js?v=202610172200"></script>
  <script src="assets/mapa.js?v=202610172200"></script>
</body>
</html>
