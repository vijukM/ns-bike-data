<body data-strana="staze" data-putanja="Mapa|Biciklističke staze">
  <main class="sadrzaj staze" id="sadrzaj">
    <header class="zaglavlje-strane pojava">
      <div>
        <span class="eyebrow" id="st-nadnaslov">Mapa · OpenStreetMap</span>
        <h1>Biciklističke <em>staze</em></h1>
      </div>
    </header>

    <section class="kartica pojava st-karta">
      <div class="st-raspored">
        <div class="st-mapa-omot">
          <div class="mapa-alat">
            <div class="grupa-kontrola"><span class="eyebrow">Prikaz</span><div id="st-mod" role="group" aria-label="Šta mapa prikazuje"></div></div>
            <div class="grupa-kontrola"><span class="eyebrow">Tip mape</span><div id="podloga"></div></div>
          </div>
          <div class="mapa st-mapa" id="mapa" role="region" aria-label="Mapa biciklističkih staza"></div>
        </div>
        <aside class="st-strana" id="st-strana" aria-live="polite"></aside>
      </div>
    </section>

    <div class="mreza-2 st-dole">
      <section class="kartica pojava">
        <div class="kartica-glava">
          <div><span class="eyebrow" id="ul-oznaka">Pravci</span><h2>Ulice sa stazom<span id="ul-info"></span></h2></div>
          <div class="pretraga st-pretraga"><svg class="ik" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="ul-pretraga" placeholder="Ulica…" aria-label="Pretraga ulica"></div>
        </div>
        <div class="tabela-omot st-tabela-omot"><table class="tabela st-tabela" id="ul-tabela"></table></div>
      </section>

      <section class="kartica pojava">
        <div class="kartica-glava">
          <div><span class="eyebrow">Delovi grada</span><h2 id="dg-naslov">Koliko ulica ima stazu</h2></div>
          <div class="grupa-kontrola"><span class="eyebrow">Mera</span><div id="dg-mera"></div></div>
        </div>
        <p class="st-napomena" id="dg-opis"></p>
        <div class="st-delovi-omot"><div class="grafik st-delovi-grafik" id="dg-grafik"></div></div>
      </section>
    </div>

    <div class="mreza-2 st-dole">
      <section class="kartica pojava">
        <div class="kartica-glava"><div><span class="eyebrow">Pravci</span><h2>Najduže ulice sa stazom<span id="nj-info"></span></h2></div></div>
        <div class="st-najduze" id="st-najduze"></div>
      </section>
      <section class="kartica pojava st-metod">
        <div class="kartica-glava"><div><span class="eyebrow">O podacima</span><h2>Odakle su staze i kako je računato</h2></div></div>
        <div class="st-metod-mreza" id="st-metod"></div>
      </section>
    </div>
  </main>
